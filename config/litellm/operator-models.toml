# Merge these model tables into the external operator TOML used for a live run.
# The same local LiteLLM gateway serves each of the four runtime roles.

[models.orchestration]
base_url = "http://127.0.0.1:4000/v1"
model = "tiktok2026-chatgpt"
api_key_env = "LITELLM_API_KEY"
temperature = 0.0
max_tokens = 4096
timeout_seconds = 120.0

